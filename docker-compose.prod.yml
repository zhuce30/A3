x-a3-logging: &a3-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    restart: unless-stopped
    logging: *a3-logging
    ports: !reset []
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}

  redis:
    restart: unless-stopped
    logging: *a3-logging
    ports: !reset []

  backend:
    image: ${A3_BACKEND_IMAGE:-ghcr.io/zhuce30/a3-backend:latest}
    restart: unless-stopped
    logging: *a3-logging
    env_file:
      - .env.production
    command:
      - uvicorn
      - backend.config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --limit-max-requests
      - "500"
      - --limit-max-requests-jitter
      - "50"
    ports: !reset []
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      DJANGO_SESSION_COOKIE_NAME: ${DJANGO_SESSION_COOKIE_NAME:-a3_sessionid}
      DJANGO_SESSION_COOKIE_DOMAIN: ${DJANGO_SESSION_COOKIE_DOMAIN:-.zhuce.work}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://a3.zhuce.work,https://zhuce.work,https://www.zhuce.work}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_INTERNAL_FRONTEND_BASE_URL: http://frontend:3000
      A3_VIDEO_WORKER_TOKEN: ${A3_VIDEO_WORKER_TOKEN:?set A3_VIDEO_WORKER_TOKEN in .env.production}
      A3_VIDEO_STORAGE_ROOT: /app/storage/a3-videos
      A3_VIDEO_STORAGE_MAX_BYTES: ${A3_VIDEO_STORAGE_MAX_BYTES:-209715200}
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "1"
      A3_SEED_DEMO_DATA: ${A3_SEED_DEMO_DATA:-1}
    volumes:
      - a3-video-data:/app/storage/a3-videos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  celery:
    image: ${A3_BACKEND_IMAGE:-ghcr.io/zhuce30/a3-backend:latest}
    restart: unless-stopped
    logging: *a3-logging
    command:
      - celery
      - -A
      - backend.config
      - worker
      - -l
      - info
      - --queues=celery
      - --concurrency=1
      - --max-tasks-per-child=5
      - --max-memory-per-child=900000
    mem_limit: 1400m
    memswap_limit: 1600m
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      DJANGO_SESSION_COOKIE_NAME: ${DJANGO_SESSION_COOKIE_NAME:-a3_sessionid}
      DJANGO_SESSION_COOKIE_DOMAIN: ${DJANGO_SESSION_COOKIE_DOMAIN:-.zhuce.work}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://a3.zhuce.work,https://zhuce.work,https://www.zhuce.work}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_INTERNAL_FRONTEND_BASE_URL: http://frontend:3000
      A3_VIDEO_WORKER_TOKEN: ${A3_VIDEO_WORKER_TOKEN:?set A3_VIDEO_WORKER_TOKEN in .env.production}
      A3_VIDEO_STORAGE_ROOT: /app/storage/a3-videos
      A3_VIDEO_STORAGE_MAX_BYTES: ${A3_VIDEO_STORAGE_MAX_BYTES:-209715200}
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "0"
      A3_SEED_DEMO_DATA: "0"
    volumes:
      - a3-video-data:/app/storage/a3-videos

  video-worker:
    image: ${A3_BACKEND_IMAGE:-ghcr.io/zhuce30/a3-backend:latest}
    restart: unless-stopped
    logging: *a3-logging
    command:
      - celery
      - -A
      - backend.config
      - worker
      - -l
      - info
      - --queues=video-compose
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=3
      - --max-memory-per-child=1200000
    mem_limit: 1800m
    memswap_limit: 2200m
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_VIDEO_TTS_API_KEY: ${A3_VIDEO_TTS_API_KEY:-}
      TTS_QWEN_API_KEY: ${TTS_QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      A3_LLM_API_KEY: ${A3_LLM_API_KEY:-}
      A3_VIDEO_STORAGE_ROOT: /app/storage/a3-videos
      A3_VIDEO_STORAGE_MAX_BYTES: ${A3_VIDEO_STORAGE_MAX_BYTES:-209715200}
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "0"
      A3_SEED_DEMO_DATA: "0"
    volumes:
      - a3-video-data:/app/storage/a3-videos
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ${A3_BACKEND_IMAGE:-ghcr.io/zhuce30/a3-backend:latest}
    restart: unless-stopped
    logging: *a3-logging
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      DJANGO_SESSION_COOKIE_NAME: ${DJANGO_SESSION_COOKIE_NAME:-a3_sessionid}
      DJANGO_SESSION_COOKIE_DOMAIN: ${DJANGO_SESSION_COOKIE_DOMAIN:-.zhuce.work}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://a3.zhuce.work,https://zhuce.work,https://www.zhuce.work}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "0"
      A3_SEED_DEMO_DATA: "0"

  frontend:
    image: ${A3_FRONTEND_IMAGE:-ghcr.io/zhuce30/a3-frontend:latest}
    restart: unless-stopped
    logging: *a3-logging
    build:
      args:
        NEXT_PUBLIC_A3_API_BASE_URL: ${NEXT_PUBLIC_A3_API_BASE_URL:-https://api.zhuce.work}
    env_file:
      - .env.production
    ports: !reset []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_A3_API_BASE_URL: ${NEXT_PUBLIC_A3_API_BASE_URL:-https://api.zhuce.work}
      A3_API_BASE_URL: http://backend:8000
      A3_TUTOR_PREVIEW_REDIS_URL: redis://redis:6379/3
      A3_INTERNAL_FRONTEND_BASE_URL: http://127.0.0.1:3000
      A3_VIDEO_WORKER_TOKEN: ${A3_VIDEO_WORKER_TOKEN:?set A3_VIDEO_WORKER_TOKEN in .env.production}
      A3_COACHING_BASE_URL: ${A3_COACHING_BASE_URL:-}
      A3_COACHING_API_KEY: ${A3_COACHING_API_KEY:-}
      A3_COACHING_MODEL: ${A3_COACHING_MODEL:-qwen-plus}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ASR_QWEN_API_KEY: ${ASR_QWEN_API_KEY:-}
      A3_REALTIME_WS_PROXY_URL: ${A3_REALTIME_WS_PROXY_URL:-wss://a3.zhuce.work/a3/realtime/ws}
    volumes:
      - a3-frontend-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime-proxy:
    image: ${A3_FRONTEND_IMAGE:-ghcr.io/zhuce30/a3-frontend:latest}
    restart: unless-stopped
    logging: *a3-logging
    command: ["node", "scripts/a3-dashscope-realtime-proxy.mjs"]
    env_file:
      - .env.production
    expose:
      - "3003"
    environment:
      A3_API_BASE_URL: http://backend:8000
      A3_REALTIME_WS_PROXY_HOST: 0.0.0.0
      A3_REALTIME_WS_PROXY_PORT: "3003"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *a3-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - a3-caddy-data:/data
      - a3-caddy-config:/config
      - a3-caddy-logs:/var/log/caddy
    depends_on:
      - frontend
      - backend
      - realtime-proxy

volumes:
  a3-caddy-data:
  a3-caddy-config:
  a3-caddy-logs:
  a3-frontend-data:
  a3-video-data:
