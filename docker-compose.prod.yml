services:
  mysql:
    restart: unless-stopped
    ports: !reset []
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}

  redis:
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - uvicorn
      - backend.config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    ports: !reset []
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://a3.zhuce.work,https://zhuce.work,https://www.zhuce.work}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "1"
      A3_SEED_DEMO_DATA: ${A3_SEED_DEMO_DATA:-1}

  celery:
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://a3.zhuce.work,https://zhuce.work,https://www.zhuce.work}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "0"
      A3_SEED_DEMO_DATA: "0"

  celery-beat:
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.zhuce.work,localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://a3.zhuce.work,https://zhuce.work,https://www.zhuce.work}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-a3_learning}
      MYSQL_USER: ${MYSQL_USER:-a3}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      A3_WAIT_FOR_DB: "1"
      A3_RUN_MIGRATIONS: "0"
      A3_SEED_DEMO_DATA: "0"

  frontend:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_A3_API_BASE_URL: ${NEXT_PUBLIC_A3_API_BASE_URL:-https://api.zhuce.work}
    env_file:
      - .env.production
    ports: !reset []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_A3_API_BASE_URL: ${NEXT_PUBLIC_A3_API_BASE_URL:-https://api.zhuce.work}
      A3_API_BASE_URL: http://backend:8000
      A3_INTERNAL_FRONTEND_BASE_URL: http://127.0.0.1:3000
      A3_COACHING_BASE_URL: ${A3_COACHING_BASE_URL:-}
      A3_COACHING_API_KEY: ${A3_COACHING_API_KEY:-}
      A3_COACHING_MODEL: ${A3_COACHING_MODEL:-qwen-plus}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      ASR_QWEN_API_KEY: ${ASR_QWEN_API_KEY:-}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - a3-caddy-data:/data
      - a3-caddy-config:/config
    depends_on:
      - frontend
      - backend

volumes:
  a3-caddy-data:
  a3-caddy-config:
