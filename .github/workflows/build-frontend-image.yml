name: Build frontend image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/a3-latest-integration
    paths:
      - OpenMAIC/**
      - .github/workflows/build-frontend-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: OpenMAIC
          file: OpenMAIC/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zhuce30/a3-frontend:latest
            ghcr.io/zhuce30/a3-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_A3_API_BASE_URL=https://api.zhuce.work
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
