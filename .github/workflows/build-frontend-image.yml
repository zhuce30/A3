name: Build frontend image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/a3-latest-integration
    paths:
      - OpenMAIC/**
      - .github/workflows/build-frontend-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: a3-frontend-image
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/codex/a3-latest-integration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: OpenMAIC
          file: OpenMAIC/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zhuce30/a3-frontend:latest
            ghcr.io/zhuce30/a3-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_A3_API_BASE_URL=https://api.zhuce.work
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
