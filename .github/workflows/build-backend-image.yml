name: Build backend image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/a3-latest-integration
    paths:
      - backend/**
      - .github/workflows/build-backend-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/codex/a3-latest-integration' }}
    concurrency:
      group: a3-backend-image
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zhuce30/a3-backend:latest
            ghcr.io/zhuce30/a3-backend:${{ github.sha }}
          cache-from: type=gha,scope=a3-backend
          cache-to: type=gha,mode=max,scope=a3-backend
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
